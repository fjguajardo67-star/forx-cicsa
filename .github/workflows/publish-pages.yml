name: Publicar FORX integrado (manual)

on:
  workflow_dispatch:
    inputs:
      accepted_backend:
        description: 'API, datos, respaldo y acceso Google verificados en el entorno real'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: forx-production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.accepted_backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Exigir CI completo aprobado para este mismo commit
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listWorkflowRuns({
              owner:context.repo.owner,repo:context.repo.repo,workflow_id:'ci.yml',
              head_sha:context.sha,status:'success',per_page:1
            });
            if (!data.workflow_runs.length) core.setFailed('Falta CI completo aprobado para el commit que se publicaría.');
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm test
      - name: Compilar para la URL habitual
        run: npm run build:production
        env:
          FORX_PUBLIC_CONFIG: ${{ vars.FORX_PUBLIC_CONFIG }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar solo el frontend compilado
        id: deployment
        uses: actions/deploy-pages@v4
